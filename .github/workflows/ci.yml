name: CI

on:
  pull_request:
  push:
    branches: [main, feat/cove-studio-v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma needs these to generate a client. They point at nothing: no step in
  # this workflow connects to a database.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
  # Next.js evaluates public configuration while collecting page data. These
  # non-secret placeholders make the clean CI build match the Docker build.
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
  NEXT_PUBLIC_API_URL: https://api.coveedu.com/api/rpc
  NEXT_PUBLIC_SITE_URL: https://cs.coveedu.com

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      turtle-server-test-redis:
        image: redis:8.0.3-alpine
        ports: ["6397:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      turtle-browser-test-redis:
        image: redis:8.0.3-alpine
        ports: ["6398:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TURTLE_TRIAL_TEST_REDIS_URL: redis://127.0.0.1:6397/1
      TURTLE_BROWSER_TEST_REDIS_URL: redis://127.0.0.1:6398/1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Shared/runtime/i18n are consumed as built packages, so they
      # compile before anything type-checks against them.
      - name: Build shared packages
        run: pnpm prepare:grading && pnpm --filter @cove/i18n build

      - name: Generate Prisma client
        run: pnpm --filter @cove/api db:generate

      - name: Validate Prisma schema
        run: pnpm --filter @cove/api db:validate

      - name: Typecheck
        run: pnpm -r typecheck

      # `pnpm -r typecheck` walks workspace packages, and `e2e/` is not one, so
      # nothing had ever compiled the suite. It shipped a real type error for
      # months as a result.
      - name: Typecheck end-to-end suite
        run: pnpm typecheck:e2e

      - name: Lint
        run: pnpm -r lint

      - name: Validate canonical routes and translations
        run: |
          pnpm --filter @cove/web routes:lint
          pnpm --filter @cove/web i18n:check

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: Verify immutable browser runtime packaging
        run: python3 deploy/scripts/turtle-browser-assets.test.py

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: bash deploy/scripts/validate-local.sh
      - name: Test learning release and rollback selection
        run: python3 deploy/scripts/learning-rollout.test.py
      - name: Verify browser admission rollback ordering
        run: python3 deploy/scripts/turtle-browser-rollback.test.py
      - name: Verify browser pilot release configuration
        run: python3 deploy/scripts/turtle-browser-release.test.py

  container-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: home
            dockerfile: deploy/docker/home.Dockerfile
            target: runtime
          - name: studio
            dockerfile: deploy/docker/web.Dockerfile
            target: runtime
          - name: api
            dockerfile: deploy/docker/api.Dockerfile
            target: runtime
          - name: judge
            dockerfile: deploy/docker/judge-worker.Dockerfile
            target: runtime
          - name: migration
            dockerfile: deploy/docker/api.Dockerfile
            target: migration
          - name: video-worker
            dockerfile: deploy/docker/api.Dockerfile
            target: video-worker
          - name: gui-service
            dockerfile: deploy/Dockerfile.gui
            target: runtime
          - name: gui-runtime
            dockerfile: packages/gui-runtime/docker/Dockerfile
            context: packages/gui-runtime/docker
            target: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: local/cove-${{ matrix.name }}:ci
          build-args: |
            DEPLOYMENT_VERSION=ci-${{ github.sha }}
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-publishable-key
            NEXT_PUBLIC_API_URL=https://api.coveedu.com/api/rpc
            NEXT_PUBLIC_SITE_URL=https://cs.coveedu.com
            NEXT_PUBLIC_STUDIO_URL=https://cs.coveedu.com
            NEXT_PUBLIC_MVP_URL=https://mvp.coveedu.com
            NEXT_PUBLIC_GUI_ENABLED=true
            NEXT_PUBLIC_TURTLE_TRIAL_ENABLED=true
            NEXT_PUBLIC_SHORT_ANSWER_ENABLED=true
            NEXT_PUBLIC_MULTIPLE_CHOICE_ENABLED=true
            NEXT_PUBLIC_VIDEO_LESSONS_ENABLED=true
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/cove-${{ matrix.name }}:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
