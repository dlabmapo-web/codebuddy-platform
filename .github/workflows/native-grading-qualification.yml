name: Native grading disposable Linux qualification
on:
  push:
    branches: [feat/native-grading-classroom-capacity]
    paths: ['packages/grading-runtime/**', 'packages/api/src/judge/**', 'packages/api/scripts/*native*', 'deploy/native/**', 'deploy/docker/native-grading.Dockerfile', '.github/workflows/native-grading-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    if: github.ref == 'refs/heads/feat/native-grading-classroom-capacity'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.native-fixture-browsers
      DOTENV_CONFIG_PATH: /dev/null
      DATABASE_URL: postgresql://build:build@127.0.0.1:1/build
      DIRECT_URL: postgresql://build:build@127.0.0.1:1/build
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.22.0'}
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - run: pnpm install --frozen-lockfile
      - run: node --test packages/api/scripts/benchmark-native-classroom.test.mjs deploy/native/deployment-contract.test.mjs deploy/native/worker-closure.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash deploy/native/build-image.sh > native-image-build.log 2>&1
      - name: Actual kernel and private full application qualification
        shell: bash
        run: |
          image="$(docker image inspect -f '{{.Id}}' cove-native-node:qualification)"
          sudo env PATH="$PATH" HOME=/root PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" bash deploy/native/qualify-linux.sh --isolated-host "$image" "$PWD/native-linux-evidence"
      # No continue-on-error: unsupported namespaces/cgroups/proc access fails this gate.
      - name: Restore runner ownership of private qualification evidence
        if: always()
        shell: bash
        run: |
          if sudo test -d "$PWD/native-linux-evidence"; then
            sudo chown -R --no-dereference -- "$(id -u):$(id -g)" "$PWD/native-linux-evidence"
          fi
      - name: Preserve failures and exact image identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-${{ github.sha }}
          path: |
            native-image-build.log
            native-linux-evidence
          retention-days: 14
