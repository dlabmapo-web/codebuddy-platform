# Netlify build for @cove/home — the COVE Edu marketing site.
#
# Only this one package deploys. The rest of the monorepo (api, web,
# judge-worker) is never built here.
#
# Kept at the repo root, with `base` left at its default, because that is what
# lets pnpm resolve the workspace: the site depends on `@cove/i18n`, and a
# build rooted at `packages/home` cannot see it.

[build]
  # The trailing `...` is load-bearing: it selects @cove/home *and its
  # dependencies*, and pnpm runs them in topological order — shared, then
  # i18n, then the site.
  #
  # Without it this fails. @cove/i18n is consumed through its `dist/`
  # (`@cove/i18n/settings` resolves to `dist/settings.js`) and `dist/` is
  # gitignored, so on a clean clone the site cannot resolve the import.
  # Verified by deleting dist/ and running this; a bare
  # `pnpm --filter @cove/home run build` fails with module-not-found.
  #
  # This is also exactly what Netlify's own UI generates when you pick
  # `packages/home` as the project to deploy, so the two agree and it does not
  # matter which one wins.
  command = "pnpm --filter \"@cove/home...\" run build"

  publish = "packages/home/.next"

  # Skip the build when a push touched neither the site nor the copy it reads.
  # Exit 0 means "nothing to do"; exit 1 means "build".
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- packages/home packages/i18n"

[build.environment]
  # The workspace requires >=22 (root package.json `engines`), and pnpm is
  # pinned by the root `packageManager` field, which Netlify honours through
  # corepack.
  NODE_VERSION = "22"

# The Next.js adapter. Deliberately unpinned: Netlify maintains it against
# current Next releases and pinning is how a site silently stops building
# after a framework upgrade.
[[plugins]]
  package = "@netlify/plugin-nextjs"
