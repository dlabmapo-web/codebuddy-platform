# Development infrastructure for Cove Studio v2.
#
# Deliberately its own Redis rather than reusing another project's: BullMQ jobs
# and a neighbouring service must not share a keyspace, a memory budget, or a
# restart. Port 6380 keeps it clear of the default so a stray client cannot
# connect to the wrong instance.
services:
  redis:
    image: redis:8-alpine
    container_name: cove-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6380:6379'
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-cove-dev-password}
      # A queue is durable state, not a cache. Under memory pressure Redis must
      # refuse writes rather than evict jobs — `allkeys-lru` here would silently
      # drop submissions and leave students waiting on a verdict that never
      # arrives.
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      # Survives a container restart with at most one second of loss.
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    volumes:
      - cove-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-cove-dev-password}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  cove-redis-data:
