name: Release Cove v2

on:
  push:
    tags:
      - "v2.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: production-v2
  cancel-in-progress: false

env:
  REGISTRY_NAMESPACE: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cove-home
            dockerfile: deploy/docker/home.Dockerfile
            target: runtime
          - image: cove-studio
            dockerfile: deploy/docker/web.Dockerfile
            target: runtime
          - image: cove-api
            dockerfile: deploy/docker/api.Dockerfile
            target: runtime
          - image: cove-judge
            dockerfile: deploy/docker/judge-worker.Dockerfile
            target: runtime
          - image: cove-migration
            dockerfile: deploy/docker/api.Dockerfile
            target: migration
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v2\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            DEPLOYMENT_VERSION=${{ github.ref_name }}-${{ github.sha }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_API_URL=https://api.coveedu.com/api/rpc
            NEXT_PUBLIC_SITE_URL=https://cs.coveedu.com
            NEXT_PUBLIC_STUDIO_URL=https://cs.coveedu.com
            NEXT_PUBLIC_MVP_URL=https://mvp.coveedu.com
            NEXT_PUBLIC_KAKAO_AUTH_ENABLED=${{ vars.NEXT_PUBLIC_KAKAO_AUTH_ENABLED }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          provenance: mode=max
          sbom: true

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure production SSH identity
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/cove-production
          chmod 600 ~/.ssh/cove-production
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Synchronize non-secret deployment assets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            --exclude deployment.env \
            --exclude generated/ \
            --exclude secrets/ \
            -e "ssh -i ~/.ssh/cove-production" \
            deploy/ "$VPS_USER@$VPS_HOST:/opt/cove/"
          ssh -i ~/.ssh/cove-production "$VPS_USER@$VPS_HOST" \
            'chmod 700 /opt/cove/scripts/*.sh /opt/cove/scripts/*.py'

      - name: Authenticate VPS to private GHCR
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_READ_USERNAME: ${{ secrets.GHCR_READ_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | ssh -i ~/.ssh/cove-production "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io --username '$GHCR_READ_USERNAME' --password-stdin"

      - name: Deploy approved v2 release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/cove-production "$VPS_USER@$VPS_HOST" \
            "/opt/cove/scripts/set-v2-release.sh '$REGISTRY_NAMESPACE' '$IMAGE_TAG'"
