groups:
  - name: cove-turtle-startup
    rules:
      - alert: TurtleAllocationUnsafe
        expr: cove_turtle_uncertain > 0 or cove_turtle_allocated > 2
        labels: {severity: critical}
        annotations:
          summary: "Public Turtle has an uncertain or excessive container allocation"
      - alert: TurtleCleanupPending
        expr: cove_turtle_draining > 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "Public Turtle cannot confirm container cleanup"
      - alert: TurtlePreparationFailures
        expr: increase(cove_turtle_prepare_failure_total[1m]) >= 3
        labels: {severity: warning}
        annotations:
          summary: "Public Turtle preparation is repeatedly failing"
      - alert: TurtleSliceOOM
        expr: increase(cove_turtle_slice_oom_total[5m]) > 0 or increase(cove_turtle_slice_oom_kill_total[5m]) > 0
        labels: {severity: critical}
        annotations:
          summary: "Public Turtle exceeded its aggregate memory budget"
      - alert: TurtleSliceMetricsStale
        expr: |
          (time() - cove_turtle_slice_collected_at_seconds > 60)
          or (absent(cove_turtle_slice_collected_at_seconds) and on() (max(up{job="turtle-startup"}) == 1))
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Public Turtle cgroup measurements are stale"
      - alert: TurtleWarmMissRate
        expr: |
          (increase(cove_turtle_warm_hit_total[15m]) / clamp_min(increase(cove_turtle_warm_hit_total[15m]) + increase(cove_turtle_warm_miss_total[15m]), 1) < 0.8)
          and (increase(cove_turtle_warm_hit_total[15m]) + increase(cove_turtle_warm_miss_total[15m]) >= 20)
          and (cove_turtle_enabled == 1)
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Public Turtle often starts without a ready standby"
      - alert: TurtleWarmStartupSlow
        expr: |
          (histogram_quantile(0.95, sum by (le, instance, job) (rate(cove_turtle_stage_seconds_bucket{stage="launch",mode="warm"}[15m]))) > 1)
          and on(instance, job) (sum by (instance, job) (increase(cove_turtle_stage_seconds_count{stage="launch",mode="warm"}[15m])) >= 20)
          and on(instance, job) (cove_turtle_enabled == 1)
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Public Turtle warm broker launch p95 exceeds one second"
  - name: cove-host
    rules:
      - alert: MetricsTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Metrics target is down"
          description: "{{ $labels.job }} / {{ $labels.instance }} has been unreachable for five minutes."

      - alert: HostDiskSpaceLow
        expr: |
          100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "VPS disk space is low"
          description: "Filesystem {{ $labels.mountpoint }} has less than 15% free space."

      - alert: HostMemoryPressure
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "VPS available memory is low"
          description: "Available memory has remained below 20% for ten minutes."

      - alert: HostMemoryCritical
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "VPS available memory is critically low"
          description: "Available memory has remained below 10% for five minutes."

      - alert: HostCpuSaturation
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "VPS CPU is saturated"
          description: "Average CPU utilization has remained above 90% for fifteen minutes."

      - alert: ContainerRecentlyMissing
        expr: time() - container_last_seen{name=~"cove-production-.+"} > 120
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Production container disappeared"
          description: "{{ $labels.name }} has not reported container metrics recently."

      - alert: CaddyRequestErrors
        expr: |
          sum(rate(caddy_http_request_errors_total[5m]))
            / clamp_min(sum(rate(caddy_http_requests_total[5m])), 0.001) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Caddy error rate is elevated"
          description: "More than one percent of requests have failed for ten minutes."
