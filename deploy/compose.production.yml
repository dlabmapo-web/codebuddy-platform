name: cove-production

x-application: &application
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  read_only: true
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"
  stop_grace_period: 30s

services:
  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deployment.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - edge
      - monitoring
    depends_on:
      home:
        condition: service_healthy
      studio:
        condition: service_healthy
      api:
        condition: service_healthy
      mvp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpus: 0.35
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  home:
    <<: *application
    image: ${HOME_IMAGE:?set HOME_IMAGE in deployment.env}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=320
      HOSTNAME: 0.0.0.0
      PORT: 3100
    networks:
      - edge
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1001,gid=1001
      - /app/packages/home/.next/cache:rw,nosuid,size=128m,uid=1001,gid=1001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/').then(r=>{if(r.status<200||r.status>=400)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 256

  studio:
    <<: *application
    image: ${STUDIO_IMAGE:?set STUDIO_IMAGE in deployment.env}
    env_file:
      - ./secrets/studio.env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1024
      HOSTNAME: 0.0.0.0
      PORT: 3000
    networks:
      - edge
      - backend
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=1001,gid=1001
      - /app/packages/web/.next/cache:rw,nosuid,size=256m,uid=1001,gid=1001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login',{redirect:'manual'}).then(r=>{if(r.status<200||r.status>=400)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    mem_limit: 1536m
    cpus: 1.25
    pids_limit: 512

  api:
    <<: *application
    image: ${API_IMAGE:?set API_IMAGE in deployment.env}
    env_file:
      - ./secrets/api.env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1024
      PORT: 4000
    networks:
      - edge
      - backend
    depends_on:
      redis:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=1001,gid=1001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 45s
    mem_limit: 1536m
    cpus: 1.25
    pids_limit: 512

  judge-worker:
    <<: *application
    image: ${JUDGE_IMAGE:?set JUDGE_IMAGE in deployment.env}
    env_file:
      - ./secrets/api.env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
      JUDGE_HEALTH_PORT: 4101
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-1}
    networks:
      - backend
      - egress
    depends_on:
      redis:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,nosuid,size=512m,uid=1001,gid=1001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4101/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    stop_grace_period: 10m
    mem_limit: 2g
    cpus: 2.00
    pids_limit: 512

  redis:
    image: redis:8.0.3-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    command:
      - /bin/sh
      - -ec
      - exec redis-server --requirepass "$$(cat /run/secrets/redis_password)" --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 768m
    cpus: 0.50
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  mvp:
    <<: *application
    image: ${MVP_IMAGE:?set MVP_IMAGE in deployment.env}
    env_file:
      - ./secrets/mvp.env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      HOSTNAME: 0.0.0.0
      PORT: 3200
    networks:
      - edge
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=1001,gid=1001
      - /app/.next/cache:rw,nosuid,size=256m,uid=1001,gid=1001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/login',{redirect:'manual'}).then(r=>{if(r.status<200||r.status>=400)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    mem_limit: 1280m
    cpus: 1.00
    pids_limit: 512

  migrate:
    image: ${MIGRATION_IMAGE:?set MIGRATION_IMAGE in deployment.env}
    profiles: [operations]
    env_file:
      - ./secrets/api.env
    environment:
      NODE_ENV: production
    networks:
      - backend
      - egress
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    depends_on:
      - node-exporter
      - cadvisor
      - alertmanager
    mem_limit: 384m
    cpus: 0.35
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  alertmanager-config:
    image: alpine:3.22.1
    restart: "no"
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        mkdir -p /alertmanager/config
        cp /source/alertmanager.yml /alertmanager/config/alertmanager.yml
        chown -R 65534:65534 /alertmanager
        chmod 0600 /alertmanager/config/alertmanager.yml
    volumes:
      - ./generated/alertmanager.yml:/source/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    network_mode: none
    mem_limit: 32m
    cpus: 0.10
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    read_only: true
    command:
      - --config.file=/alertmanager/config/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager_data:/alertmanager
    networks:
      - monitoring
      - egress
    depends_on:
      alertmanager-config:
        condition: service_completed_successfully
    mem_limit: 96m
    cpus: 0.15
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    user: "472:472"
    env_file:
      - ./secrets/monitoring.env
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: 3000
      GF_SERVER_ROOT_URL: http://localhost:3300
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana is opened only through an encrypted SSH tunnel terminating at
      # loopback. The browser-facing URL is therefore HTTP localhost.
      GF_SECURITY_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:3300:3000"
    security_opt:
      - no-new-privileges:true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
    mem_limit: 384m
    cpus: 0.25
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    mem_limit: 96m
    cpus: 0.10
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
  egress:
  backend:
    internal: true
  monitoring:
    internal: true

secrets:
  redis_password:
    file: ./secrets/redis-password

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
